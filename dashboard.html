<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>금융 시계열 연구 대시보드 · 체험판</title>
<style>
/* 색 토큰 — 실제 서비스의 tokens.css와 같은 구성 */
:root{
  --bg:#0e1118; --surface:#141924; --surface2:#1a2030; --surface3:#222a3b; --line:#262d3d; --line2:#1d2331; --hover:#1b2232;
  --ink:#e8ecf4; --ink2:#bac2d3; --muted:#8a93a8; --faint:#4d566b;
  --brand:#7c9cff; --brand-weak:rgba(124,156,255,.14); --on-brand:#0e1118;
  --ma1:#f4b740; --ma2:#a78bfa;
  --st-queued:#8a93a8; --st-running:#5b9dff; --st-stopping:#f4b740; --st-stopped:#6d768a; --st-done:#2bb98a; --st-failed:#f0505a;
  --ok:#2bb98a; --warn:#f4b740; --bad:#f0505a;
  --kr-up:#f0505a; --kr-down:#3d7ef0; --gl-up:#2bb98a; --gl-down:#f0505a;
  --chart-grid:#1c2231; --cross:#5a6480; --cross-label:#2a3350;
  --dcard-bg:rgba(20,25,36,.88); --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.45);
  --opt-bg:#1d2433; --opt-line:#2c3448; --opt-ink:#c3cbdd;
  --err-ink:#ffb8bc; --err-bg:rgba(240,80,90,.1);
  --mono:ui-monospace,"JetBrains Mono","Consolas",monospace;
  --sans:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f6fa; --surface:#ffffff; --surface2:#f2f4f9; --surface3:#e7ebf3; --line:#dde2ec; --line2:#ebeef4; --hover:#eef1f7;
  --ink:#141a26; --ink2:#3b4558; --muted:#6b7489; --faint:#a2a9b8;
  --brand:#4565e8; --brand-weak:rgba(69,101,232,.10); --on-brand:#ffffff;
  --ma1:#d9921a; --ma2:#7b5ce0;
  --st-queued:#6b7489; --st-running:#2f74e8; --st-stopping:#c98510; --st-stopped:#8a93a6; --st-done:#11a06f; --st-failed:#e0404b;
  --ok:#11a06f; --warn:#c98510; --bad:#e0404b;
  --kr-up:#e0404b; --kr-down:#2f6fe0; --gl-up:#11a06f; --gl-down:#e0404b;
  --chart-grid:#eef1f6; --cross:#9aa3b5; --cross-label:#3b4558;
  --dcard-bg:rgba(255,255,255,.94); --shadow:rgba(20,26,38,.14); --scrim:rgba(20,26,38,.28);
  --opt-bg:#f2f4f9; --opt-line:#d7dde9; --opt-ink:#3b4558;
  --err-ink:#a8232e; --err-bg:rgba(224,64,75,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.sp{flex:1}
.hide{display:none !important}

/* 데모 안내 띠 */
.demobar{position:fixed;inset:0 0 auto 0;height:28px;z-index:60;display:flex;align-items:center;gap:9px;
  padding:0 13px;background:var(--brand);color:var(--on-brand);font-size:11.5px;font-weight:600}
.demobar .tag{background:rgba(255,255,255,.22);border-radius:5px;padding:1px 6px}
.app{display:flex;height:100vh;padding-top:28px}

/* ---------- 사이드 메뉴 ---------- */
.side{width:234px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .18s}
.side.collapsed{width:66px}
.side.collapsed .navtxt,.side.collapsed .slabel,.side.collapsed .wl,.side.collapsed .sfoot .ft,.side.collapsed .brandtxt,.side.collapsed .navcaret,.side.collapsed .navsubs{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:14px 15px 12px;border-bottom:1px solid var(--line2);min-height:60px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--brand-weak);display:grid;place-items:center;color:var(--brand);flex:none}
.brand .nm{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.brand .sb{font-size:10.5px;color:var(--muted);white-space:nowrap}
.colbtn{margin-left:auto;width:25px;height:25px;border-radius:6px;color:var(--muted);display:grid;place-items:center;flex:none}
.colbtn:hover{background:var(--hover);color:var(--ink)}
.side.collapsed .colbtn{margin:0}
.side.collapsed .colbtn svg{transform:rotate(180deg)}
.side.collapsed .brand{flex-direction:column;padding:12px 0 8px;gap:7px}
.slabel{font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.08em;padding:14px 17px 5px}
.navs{padding:0 9px;display:flex;flex-direction:column;gap:2px}
.navi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink2);width:100%;text-align:left;font-size:13px}
.navi:hover{background:var(--hover);color:var(--ink)}
.navi.on{background:var(--brand-weak);color:var(--brand);font-weight:650}
.navi svg{width:17px;height:17px;flex:none}
.navcaret{margin-left:auto;display:inline-flex;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
.navgroup.open .navcaret{transform:rotate(-90deg)}
.navsubs{display:flex;flex-direction:column;gap:2px;margin:2px 0 2px 16px;padding-left:9px;border-left:1px solid var(--line)}
.navsubs[hidden]{display:none}
.navsub{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;color:var(--muted);font-size:12.5px;width:100%;text-align:left}
.navsub:hover{background:var(--hover);color:var(--ink)}
.navsub.on{color:var(--brand);font-weight:650;background:var(--brand-weak)}
.navsub svg{width:14px;height:14px;flex:none}
.navbadge{margin-left:auto;background:var(--st-running);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;font-weight:700}
.svcdot{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:auto;flex:none}
.wl{padding:0 9px;overflow:auto;flex:1;min-height:60px}
.wlsearch{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin-bottom:6px}
.wlsearch input{background:none;border:0;outline:none;width:100%;font-size:12px}
.wlsearch svg{width:13px;height:13px;color:var(--faint);flex:none}
.wli{display:grid;grid-template-columns:1fr auto;gap:1px 8px;width:100%;text-align:left;padding:6px 8px;border-radius:9px}
.wli:hover{background:var(--hover)}
.wli.on{background:var(--surface2)}
.wli .s{font-weight:650;font-size:12.5px}
.wli .p{font-family:var(--mono);font-size:12.5px}
.wli .n{font-size:10.5px;color:var(--muted)}
.wli .c{font-family:var(--mono);font-size:10.5px;text-align:right}
.wlempty{padding:14px 8px;text-align:center;color:var(--muted);font-size:12px}
.sfoot{padding:9px 13px 11px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:7px}
.themeseg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.themeseg button{flex:1;height:25px;border-radius:7px;color:var(--muted);display:grid;place-items:center}
.themeseg button.on{background:var(--surface3);color:var(--ink)}
.themeseg svg{width:14px;height:14px}
.conn{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);cursor:pointer;width:100%}
.conn .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.conn.off .dot{background:var(--warn)}
.me{display:flex;align-items:center;gap:7px;font-size:12px}
.me .lv{font-size:9.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.lnk{color:var(--brand);background:none;border:0;padding:0;font-size:11.5px;text-align:left}
.lnk:hover{text-decoration:underline}
.ft{font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ver{font-size:10.5px;color:var(--faint)}

/* ---------- 본문 ---------- */
.view{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.page{flex:1;min-height:0;display:flex;flex-direction:column;padding:15px 19px 13px;gap:11px;overflow-y:auto}
h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:13px;font-weight:650}
.crumb{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.crumb a{color:var(--muted);cursor:pointer}
.crumb a:hover{color:var(--brand)}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.rhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card>.hd{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card>.hd .sub{margin:0;font-size:11.5px}
.card>.bd{padding:11px 14px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:11px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1150px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.kpi{padding:13px 14px}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:650;font-family:var(--mono);margin-top:3px;letter-spacing:-.02em}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
.kpi .s{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-queued{color:var(--st-queued);background:color-mix(in srgb,var(--st-queued) 14%,transparent)}
.st-running{color:var(--st-running);background:color-mix(in srgb,var(--st-running) 14%,transparent)}
.st-stopping{color:var(--st-stopping);background:color-mix(in srgb,var(--st-stopping) 14%,transparent)}
.st-stopped{color:var(--st-stopped);background:color-mix(in srgb,var(--st-stopped) 16%,transparent)}
.st-done{color:var(--st-done);background:color-mix(in srgb,var(--st-done) 14%,transparent)}
.st-failed{color:var(--st-failed);background:color-mix(in srgb,var(--st-failed) 14%,transparent)}
.primary{height:33px;padding:0 13px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.primary:hover:not(:disabled){filter:brightness(1.08)}
.ghost{height:29px;padding:0 11px;border-radius:8px;border:1px solid var(--line);color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.ghost:hover:not(:disabled){border-color:var(--faint);color:var(--ink)}
.ghost.sm{height:25px;padding:0 9px;font-size:12px}
.ghost.danger:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.ghost.on{border-color:var(--ok);color:var(--ok)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{height:27px;padding:0 11px;border-radius:7px;color:var(--muted);font-size:12.5px;white-space:nowrap;border:1px solid transparent}
.seg button:hover{color:var(--ink);background:var(--hover)}
.seg button.on{background:var(--surface3);color:var(--ink);font-weight:650;border-color:var(--opt-line);box-shadow:0 1px 2px var(--shadow)}
.seg button .c{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:5px}
.opt{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:600;
  background:var(--opt-bg);border:1px solid var(--opt-line);color:var(--opt-ink)}
.opt.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:color-mix(in srgb,var(--ok) 36%,transparent);color:var(--ok)}
.opt.off{background:transparent;border-color:var(--line);color:var(--muted);font-weight:500}
.toggle{width:30px;height:18px;border-radius:9px;background:var(--surface3);position:relative;flex:none;border:1px solid var(--line)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle.on{background:var(--brand-weak);border-color:var(--brand)}
.toggle.on::after{left:14px;background:var(--brand)}
table{width:100%;border-collapse:collapse}
.tablewrap{overflow:auto;max-height:420px}
th{position:sticky;top:0;z-index:1;background:var(--surface);font-size:10.5px;font-weight:600;color:var(--muted);text-align:right;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
th.sortable{cursor:pointer;user-select:none}
th .ar{color:var(--brand)}
td{padding:8px 9px;border-bottom:1px solid var(--line2);text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
td.txt{font-family:var(--sans)}
td.nm{font-family:var(--sans);font-weight:650;text-align:left}
td .sub{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--muted);margin:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--brand-weak)}
tr.sub-row td{background:var(--surface2)}
td.best,.cmptab td.best{color:var(--ink);font-weight:700}
.empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:12.5px}
.empty.tight{padding:6px 14px 12px}
.note{font-size:11.5px;color:var(--muted);padding:9px 0 2px}
.note code{font:11.5px var(--mono);background:var(--surface2);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.err{background:var(--err-bg);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);color:var(--err-ink);border-radius:10px;padding:9px 11px;font-size:12px}
.err.mono{font-family:var(--mono);font-size:11.5px;word-break:break-word}
.okline{background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);color:var(--ink2);border-radius:10px;padding:9px 11px;font-size:12px}
.warnband{padding:9px 11px;border-radius:10px;font-size:12px;color:var(--ink);background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field textarea{font-family:var(--mono);font-size:12px;resize:vertical}
.field .hint{font-size:11px;color:var(--faint)}
.field .ferr{font-size:11.5px;color:var(--bad)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fgrid .full{grid-column:1/-1}

/* 차트 */
.phead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.ident .t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ident .sym{font-size:21px;font-weight:700;letter-spacing:-.02em}
.quote{margin-left:auto;text-align:right}
.quote .px{font-family:var(--mono);font-size:26px;font-weight:650;line-height:1.1}
.quote .chg{font-family:var(--mono);font-size:12.5px;margin-top:2px}
.quote .upd{font-size:11px;color:var(--muted);margin-top:2px}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ccard{flex:1;min-height:400px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.chartbox{flex:1;min-height:0;position:relative}
#chart{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.dcard{position:absolute;left:11px;top:11px;pointer-events:none;background:var(--dcard-bg);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;min-width:205px;backdrop-filter:blur(4px);font-size:11.5px}
.dcard .dt{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.dcard .g{display:grid;grid-template-columns:auto auto auto auto;gap:2px 9px;margin-top:5px;align-items:baseline}
.dcard .g span{color:var(--muted);font-size:10.5px}
.dcard .g b{font-family:var(--mono);font-weight:500;text-align:right}
.cfoot{height:29px;flex:none;display:flex;align-items:center;gap:9px;padding:0 12px;border-top:1px solid var(--line2);font-size:11px;color:var(--muted)}

/* 학습 상세 · 비교 */
.ex-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line2)}
.ex-search{position:relative}
.ex-search svg{position:absolute;left:9px;top:8px;width:13px;height:13px;color:var(--faint)}
.ex-search input{width:200px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px 6px 28px;outline:none;font-size:12.5px}
.ex-split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;padding:4px 14px 16px}
@media (max-width:1100px){.ex-split{grid-template-columns:minmax(0,1fr)}}
.ex-sec{font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin:14px 0 7px;font-weight:600}
.ex-loss{height:150px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.mbox{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:7px 9px;min-width:0}
.mbox .k{font-size:10.5px;color:var(--muted)}
.mbox .v{font-family:var(--mono);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.mtab td{padding:6px 9px}
.mtab td:last-child{text-align:right}
pre.cfg{margin:0;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);overflow:auto;max-height:190px}
.cmp{border-top:1px solid var(--line);padding:11px 14px}
.cmphd{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.cmptab td,.cmptab th{padding:6px 8px;text-align:right;font-family:var(--mono);white-space:nowrap;position:static}
.cmptab th{color:var(--muted);font-weight:600;font-family:var(--sans);font-size:10.5px}
.cmptab th:first-child,.cmptab td:first-child{text-align:left;font-family:var(--sans);color:var(--muted)}
.cmptab tr.sec td{color:var(--faint);font:600 10px var(--sans);letter-spacing:.06em;padding-top:11px;border-bottom:0}
.sw2{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.evl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.evl li{display:grid;grid-template-columns:7px 112px 1fr;gap:9px;align-items:center;font-size:11.5px}
.evl .t{color:var(--muted);font-size:11px;font-family:var(--mono)}
.evl .d{color:var(--ink2)}
.legendrow{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);padding:2px 14px 11px}
.legendrow span{display:inline-flex;align-items:center;gap:6px}
.legendrow i{width:10px;height:10px;border-radius:3px}

/* 수집 · 모듈 */
.run{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.run:last-child{border-bottom:0}
.run .nm{font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

function rng(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296) }
const pad = n => String(n).padStart(2, '0')
const nf = (v, d = 0) => v == null || !isFinite(v) ? '—' : v.toLocaleString('en-US', { minimumFractionDigits:d, maximumFractionDigits:d })

  if (s < 3600) return Math.floor(s/60) + '분'
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60)
  return m ? `${h}시간 ${m}분` : `${h}시간`

function fmtMD(sec){ const d = new Date(sec*1000); return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}` }

const CANDLE_COUNT = 240
const candleCache = new Map()
function candles(symbol, tfCode){
  const key = symbol + '|' + tfCode
  if (candleCache.has(key)) return candleCache.get(key)
  const sym = SYMBOLS.find(s => s.symbol === symbol)
  const tf = TIMEFRAMES.find(t => t.code === tfCode)
  const r = rng(sym.seed * 7919 + tf.unit * 13)
  const step = sym.vol * Math.sqrt(tf.unit / 390)
  const closes = new Array(CANDLE_COUNT)
  let p = sym.last, drift = 0
  for (let i = CANDLE_COUNT - 1; i >= 0; i--) {
    closes[i] = p
    if (i % 24 === 0) drift = (r() - 0.47) * step * 0.55
    const shock = (r() + r() + r() - 1.5) * step * 0.78
    p = p / (1 + shock + drift)
    if (p < sym.last * 0.3) p = sym.last * 0.3
  }
  const out = closes.map((close, i) => {
    const open = i === 0 ? close * (1 - (r() - 0.5) * step) : closes[i - 1]
    const body = Math.abs(close - open)
    const wick = (body + close * step * 0.25) * (0.3 + r())
    const base = sym.kr ? 9e5 : 2.4e7
    return {
      time: NOW - (CANDLE_COUNT - 1 - i) * tf.sec,
      open, close,
      high: Math.max(open, close) + wick * r(),
      low: Math.min(open, close) - wick * r(),
      volume: Math.max(1, Math.round((0.55 + r()) * base * (tf.unit / 390) ** 0.7 * (1 + body / close * 25))),
    }
  })
  candleCache.set(key, out)
  return out
}
function sma(values, n){
  const out = new Array(values.length).fill(null)
  let sum = 0
  for (let i = 0; i < values.length; i++) {
    sum += values[i]; if (i >= n) sum -= values[i - n]
    if (i >= n - 1) out[i] = sum / n
  }
  return out
}

function bindChart(){
  const canvas = $('#chart'); if (!canvas) return
  canvas.onmousemove = e => {
    const r = canvas.getBoundingClientRect()
    state.hover = { x: e.clientX - r.left, y: e.clientY - r.top }
    drawChart()
  }
  canvas.onmouseleave = () => { state.hover = null; drawChart() }
  canvas.onwheel = e => {
    e.preventDefault()
    const all = candles(state.symbol, state.tf)
    state.zoom = Math.max(30, Math.min(all.length, Math.round(state.zoom * (e.deltaY > 0 ? 1.15 : 0.87))))
    state.offset = Math.max(0, Math.min(all.length - state.zoom, state.offset))
    drawChart()
  }
  let drag = null
  canvas.onpointerdown = e => { drag = { x:e.clientX, off:state.offset }; canvas.setPointerCapture(e.pointerId) }
  canvas.onpointerup = () => { drag = null }
  canvas.onpointermove = e => {
    if (!drag || !chartGeom) return
    const all = candles(state.symbol, state.tf)
    state.offset = Math.max(0, Math.min(all.length - state.zoom, drag.off + Math.round((e.clientX - drag.x) / chartGeom.cw)))
    drawChart()
  }
  canvas.ondblclick = () => { state.zoom = 120; state.offset = 0; drawChart() }
}
let chartGeom = null
function drawChart(){
  const canvas = $('#chart'); if (!canvas) return
  const box = canvas.parentElement.getBoundingClientRect()
  const dpr = window.devicePixelRatio || 1
  canvas.width = Math.round(box.width * dpr); canvas.height = Math.round(box.height * dpr)
  const ctx = canvas.getContext('2d')
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, box.width, box.height)
  const W = box.width, H = box.height, PR = 62, PB = 20, PL = 8, PT = 8
  const t = tokens(), grid = cssVar('--chart-grid'), muted = cssVar('--muted')
  const all = candles(state.symbol, state.tf)
  const end = Math.max(10, all.length - state.offset), start = Math.max(0, end - state.zoom)
  const rows = all.slice(start, end)
  if (!rows.length) return

  const volH = 56, priceH = H - PT - PB - volH
  const cw = (W - PL - PR) / rows.length, bw = Math.max(1, Math.min(13, cw * 0.68))
  const xOf = i => PL + cw * (i + 0.5)
  const closes = rows.map(c => c.close)
  const ma = [[20, '--ma1'], [60, '--ma2']].map(([n, tok]) => ({ n, tok, s: sma(closes, n) }))

  let hi = -Infinity, lo = Infinity
  rows.forEach(c => { hi = Math.max(hi, c.high); lo = Math.min(lo, c.low) })
  ma.forEach(m => m.s.forEach(v => { if (v != null) { hi = Math.max(hi, v); lo = Math.min(lo, v) } }))
  const pad2 = (hi - lo) * 0.08 || hi * 0.01
  hi += pad2; lo -= pad2
  const yP = v => PT + priceH - (v - lo) / (hi - lo) * priceH

  ctx.font = '10px ' + cssVar('--mono'); ctx.textBaseline = 'middle'; ctx.lineWidth = 1
  ctx.strokeStyle = grid; ctx.fillStyle = muted
  for (let i = 0; i <= 5; i++) {
    const v = lo + (hi - lo) * i / 5, y = Math.round(yP(v)) + 0.5
    ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(W - PR, y); ctx.stroke()
    ctx.textAlign = 'left'; ctx.fillText(nf(v, t.digits), W - PR + 6, y)
  }
  rows.forEach((c, i) => {
    const up = c.close >= c.open, col = up ? t.up : t.down, x = xOf(i)
    ctx.strokeStyle = col; ctx.fillStyle = col
    ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, yP(c.high)); ctx.lineTo(Math.round(x) + 0.5, yP(c.low)); ctx.stroke()
    const yo = yP(c.open), yc = yP(c.close)
    ctx.fillRect(x - bw/2, Math.min(yo, yc), bw, Math.max(1, Math.abs(yc - yo)))
  })
  ma.forEach(m => {
    ctx.strokeStyle = cssVar(m.tok); ctx.lineWidth = 1.3; ctx.beginPath(); let st = false
    m.s.forEach((v, i) => { if (v == null) return; const x = xOf(i), y = yP(v); st ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), st = true) })
    ctx.stroke()
  })
  const vmax = Math.max(...rows.map(c => c.volume))
  ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(PL, PT + priceH + 0.5); ctx.lineTo(W - PR, PT + priceH + 0.5); ctx.stroke()
  rows.forEach((c, i) => {
    const h = c.volume / vmax * (volH - 8)
    ctx.fillStyle = (c.close >= c.open ? t.up : t.down) + '99'
    ctx.fillRect(xOf(i) - bw/2, PT + priceH + volH - h, bw, h)
  })
  ctx.fillStyle = muted; ctx.textAlign = 'left'; ctx.fillText(fmtVol(vmax), W - PR + 6, PT + priceH + 10)
  ctx.textAlign = 'center'
  const step = Math.max(1, Math.round(rows.length / 7))
  rows.forEach((c, i) => { if (i % step === 0) ctx.fillText(fmtDT(c.time).slice(5, state.tf === '1d' || state.tf === '1w' ? 10 : 16), xOf(i), H - PB/2) })

  const lastC = rows[rows.length-1], ly = yP(lastC.close)
  ctx.fillStyle = lastC.close >= lastC.open ? t.up : t.down
  ctx.fillRect(W - PR + 2, ly - 8, PR - 4, 16)
  ctx.fillStyle = '#fff'; ctx.fillText(nf(lastC.close, t.digits), W - PR/2, ly)

  let hoverIdx = rows.length - 1
  if (state.hover) {
    hoverIdx = Math.max(0, Math.min(rows.length - 1, Math.floor((state.hover.x - PL) / cw)))
    const x = Math.round(xOf(hoverIdx)) + 0.5, y = Math.round(state.hover.y) + 0.5
    ctx.strokeStyle = cssVar('--cross'); ctx.setLineDash([4, 4])
    ctx.beginPath(); ctx.moveTo(x, PT); ctx.lineTo(x, H - PB); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(W - PR, y); ctx.stroke()
    ctx.setLineDash([])
    if (y > PT && y < PT + priceH) {
      const v = lo + (PT + priceH - y) / priceH * (hi - lo)
      ctx.fillStyle = cssVar('--cross-label'); ctx.fillRect(W - PR + 2, y - 8, PR - 4, 16)
      ctx.fillStyle = '#fff'; ctx.fillText(nf(v, t.digits), W - PR/2, y)
    }
  }
  chartGeom = { cw }
  const c = rows[hoverIdx], d = c.close - c.open
  const dc = $('#dcard')
  if (dc) dc.innerHTML = `
    <div class="dt">${fmtDT(c.time)} · ${TIMEFRAMES.find(x => x.code === state.tf).label}</div>
    <div class="g"><span>시가</span><b>${nf(c.open, t.digits)}</b><span>고가</span><b>${nf(c.high, t.digits)}</b>
      <span>저가</span><b>${nf(c.low, t.digits)}</b><span>종가</span><b>${nf(c.close, t.digits)}</b></div>
    <div class="g" style="grid-template-columns:auto auto 1fr">
      <span style="color:${d >= 0 ? t.up : t.down}">${signed(d, t.digits)} (${signed(d / c.open * 100, 2)}%)</span>
      <span>거래량</span><b style="text-align:left">${fmtVol(c.volume)}</b></div>
    ${ma.map(m => m.s[hoverIdx] != null ? `<span class="num" style="color:var(${m.tok});font-size:11px;margin-right:8px">평균 ${m.n} ${nf(m.s[hoverIdx], t.digits)}</span>` : '').join('')}`
}

function kpi(label, value, sub, color){
  return `<div class="card kpi s3"><div class="l">${label}</div>
    <div class="v" ${color ? `style="color:${color}"` : ''}>${value}</div>
    ${sub ? `<div class="s">${sub}</div>` : ''}</div>`
}
const statusLabel = s => ({ queued:'대기', running:'실행 중', stopping:'중단 중', stopped:'중단', done:'완료', failed:'실패' }[s])
const tfLabel = c => (TIMEFRAMES.find(t => t.code === c) || { label:c }).label

function timelineSVG(list){
  const W = 1100, laneH = 26, left = 76, days = 7
  const t0 = NOW - days * 86400
  const lanes = WORKERS
  const H = lanes.length * laneH + 26
  const xOf = ts => left + (ts - t0) / (days * 86400) * (W - left - 12)
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">`
  for (let d = 0; d <= days; d++) {
    const x = xOf(t0 + d * 86400)
    s += `<line x1="${x}" y1="16" x2="${x}" y2="${H - 8}" stroke="${cssVar('--line2')}"/>`
    s += `<text x="${x + 3}" y="11" fill="${cssVar('--muted')}" font-size="10">${new Date((t0 + d*86400)*1000).getMonth()+1}/${new Date((t0 + d*86400)*1000).getDate()}</text>`
  }
  lanes.forEach((w, i) => {
    const y = 20 + i * laneH
    s += `<text x="6" y="${y + 13}" fill="${cssVar('--ink2')}" font-size="11" font-family="${cssVar('--mono')}">${w}</text>`
    s += `<rect x="${left}" y="${y}" width="${W - left - 12}" height="${laneH - 6}" fill="${cssVar('--surface2')}" rx="4"/>`
    list.filter(e => e.workerId === w && e.startedAt && e.startedAt > t0).forEach(e => {
      const x1 = Math.max(left, xOf(e.startedAt)), x2 = xOf(e.finishedAt ?? NOW)
      const col = cssVar('--st-' + (e.status === 'stopping' ? 'running' : e.status))
      s += `<rect x="${x1}" y="${y}" width="${Math.max(3, x2 - x1)}" height="${laneH - 6}" fill="${col}" rx="4" opacity=".92"><title>${esc(e.name)} · ${statusLabel(e.status)}</title></rect>`
      if (x2 - x1 > 70) s += `<text x="${x1 + 6}" y="${y + 14}" fill="${cssVar('--surface')}" font-size="10" font-weight="600">${esc(e.name)}</text>`
    })
  })
  const nx = xOf(NOW)
  s += `<line x1="${nx}" y1="16" x2="${nx}" y2="${H - 8}" stroke="${cssVar('--ink')}" stroke-dasharray="3 3"/>`
  return s + '</svg>'
}
function scorecardTable(rows){
  const best = {}
  METRIC_KEYS.forEach(k => {
    const vals = rows.map(e => e.finalMetrics?.[k]).filter(v => v != null)
    if (vals.length) best[k] = lowerIsBetter(k) ? Math.min(...vals) : Math.max(...vals)
  })
  return `<table><thead><tr><th class="l">학습</th><th class="l">모델 · 종목 · 주기</th><th>학습 행</th>
    ${METRIC_KEYS.map(k => `<th>${k}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(e => `<tr><td class="nm">${e.name}</td>
      <td class="txt l">${e.modelType} · ${e.symbol} · ${tfLabel(e.timeframe)}</td>
      <td>${nf(e.dataRows)}</td>
      ${METRIC_KEYS.map(k => `<td class="${e.finalMetrics[k] === best[k] ? 'best' : ''}">${fmtMetric(e.finalMetrics[k])}</td>`).join('')}
    </tr>`).join('')}</tbody></table>`
}
function stopExperiment(id){
  const e = allExperiments().find(x => x.id === id)
  if (!e) return
  if (!confirm(`"${e.name}" 학습을 중단할까요?`)) return
  if (e.status === 'queued') { e.status = 'stopped'; e.finishedAt = NOW }
  else { e.status = 'stopping'; setTimeout(() => { e.status = 'stopped'; e.finishedAt = NOW; render() }, 1200) }
  render()
}

function lossSVG(e){
  const vals = e.loss
  const W = 420, H = 130, hi = Math.max(...vals), lo = Math.min(...vals)
  const x = i => 6 + i / (vals.length - 1) * (W - 12)
  const y = v => H - 10 - (v - lo) / (hi - lo || 1) * (H - 26)
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none">
    <path d="${d} L${W-6} ${H-10} L6 ${H-10} Z" fill="${cssVar('--brand')}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${cssVar('--brand')}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <text x="8" y="12" fill="${cssVar('--muted')}" font-size="10">epoch 1~${vals.length} · 최종 ${vals[vals.length-1].toFixed(4)}</text>
  </svg>`
}

function coverageRows(s, i){
  const open = state.covOpen[s.symbol]
  const late = i === 2
  const head = `<tr data-cov="${s.symbol}">
    <td class="nm"><span class="tw">${open ? '▾' : '▸'}</span>${s.symbol}</td>
    <td class="l">봉 ${TIMEFRAMES.length}개</td>
    <td><span class="opt ok">수집</span></td>
    <td>${fmtDT(NOW - (s.kr ? 26000 : 63000))}</td>
    <td>${late ? '1시간 12분' : '—'}</td><td>${nf(470 + i * 13)}</td>
    <td><span class="badge ${late ? 'st-stopping' : 'st-stopped'}">${late ? '지연' : '장 마감'}</span></td></tr>`
  if (!open) return head
  const subs = TIMEFRAMES.map((tf, k) => `<tr class="sub-row"><td></td><td class="l">${tf.label}</td>
    <td><span class="opt ${k < 5 ? 'ok' : 'off'}">${k < 5 ? '수집' : '안 함'}</span></td>
    <td>${fmtDT(NOW - (s.kr ? 26000 : 63000) - k * 60)}</td><td>—</td><td>${nf(Math.round((470 + i*13) / (k+1)))}</td>
    <td><span class="badge st-stopped">장 마감</span></td></tr>`).join('')
  return head + subs
}

function targetTree(){
  const byCountry = { KR:{ label:'한국', markets:{} }, US:{ label:'미국', markets:{} } }
  SYMBOLS.forEach(s => {
    const c = byCountry[s.country]
    ;(c.markets[s.exchange] = c.markets[s.exchange] || []).push(s)
  })
  return Object.entries(byCountry).map(([code, c]) => {
    const open = state.treeOpen[code]
    const n = Object.values(c.markets).flat().length
    return `<button class="lv1" data-tree="${code}"><span class="tw">${open ? '▾' : '▸'}</span>${c.label}<span class="c">${n}</span></button>` +
      (open ? Object.entries(c.markets).map(([m, list]) =>
        `<button class="lv2">${m}<span class="c">${list.length}</span></button>` +
        list.map(s => `<button class="lv3"><span class="dot" style="background:var(${state.targets[s.symbol] ? '--ok' : '--faint'})"></span>${s.symbol}</button>`).join('')
      ).join('') : '')
  }).join('')
}

  page.querySelector('[data-act="tpl"]').onclick = () => alertCard('체험판에서는 파일을 내려받지 않습니다. 실제 서비스에서는 템플릿 압축을 바로 받습니다.')
  page.querySelector('[data-act="upload"]').onclick = () => {
    state.myModule = { installed:true, enabled:true }
    render()
    alertCard('체험판이라 올린 척만 했습니다 — 설치된 모습으로 바뀝니다.')
  }
  page.querySelectorAll('[data-my]').forEach(b => b.onclick = () => {
    if (b.dataset.my === 'stop') state.myModule.enabled = false
    if (b.dataset.my === 'start') state.myModule.enabled = true
    render()
  })
  return page
}

function modal({ title, body, footer, wide }){
  const host = $('#modalhost')
  const wrap = el('div', 'modalwrap')
  wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <div class="mh"><h2>${title}</h2><button class="x" data-close>${svg(I.close, 15)}</button></div>
    <div class="mb">${body}</div>
    ${footer ? `<div class="mf">${footer}</div>` : ''}
  </div>`
  const close = () => host.innerHTML = ''
  wrap.onpointerdown = e => { if (e.target === wrap) close() }
  wrap.querySelector('[data-close]').onclick = close
  document.addEventListener('keydown', function esc2(e){ if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc2) } })
  host.innerHTML = ''
  host.appendChild(wrap)
  return { wrap, close }
}
function alertCard(msg){
  const { wrap, close } = modal({ title:'체험판 안내', body:`<div class="note" style="padding:0">${msg}</div>`, footer:'<button class="primary" data-ok>확인</button>' })
  wrap.querySelector('[data-ok]').onclick = close
}

    body:`<div class="fgrid">
      <div class="field"><label>이름</label><input id="nx-name" value="lstm-spy-15m-v6" /></div>
      <div class="field"><label>모델</label><input id="nx-model" value="lstm" /><span class="hint">파이프라인 담당자와 합의한 값</span></div>
      <div class="field"><label>종목</label><select id="nx-sym">${SYMBOLS.map(s => `<option>${s.symbol}</option>`).join('')}</select></div>
      <div class="field"><label>주기</label><select id="nx-tf">${TIMEFRAMES.map(t => `<option value="${t.code}">${t.label}</option>`).join('')}</select></div>
      <div class="field"><label>학습 시작일</label><input id="nx-from" type="date" value="2024-01-01" /></div>
      <div class="field"><label>학습 종료일</label><input id="nx-to" type="date" value="2026-09-30" /><span class="hint">UTC 0시 기준, 종료일은 포함하지 않음</span></div>
      <div class="field full"><label>설정 (config JSON)</label><textarea id="nx-cfg" rows="7">{
  "seq_len": 64,
  "hidden": 128,
  "layers": 2,
  "lr": 0.0005,
  "batch_size": 128,
  "epochs": 40
}</textarea><span class="hint" id="nx-err">JSON 객체인지만 확인합니다. 내용은 파이프라인이 해석합니다</span></div>
    </div>`,
    footer:'<button class="ghost" data-close2>취소</button><button class="primary" data-ok>학습 만들기</button>',
  })
  wrap.querySelector('[data-close2]').onclick = close
  wrap.querySelector('[data-ok]').onclick = () => {
    let cfg
    try { cfg = JSON.parse(wrap.querySelector('#nx-cfg').value) }
    catch { const h = wrap.querySelector('#nx-err'); h.className = 'ferr'; h.textContent = 'JSON 형식이 아닙니다'; return }
    const name = wrap.querySelector('#nx-name').value.trim() || 'untitled'
    state.extra.unshift({
      id: 'exp-' + Math.random().toString(16).slice(2, 10),
      name, modelType: wrap.querySelector('#nx-model').value.trim() || 'lstm',
      symbol: wrap.querySelector('#nx-sym').value, timeframe: wrap.querySelector('#nx-tf').value,
      status:'queued', progress:0, workerId:null, createdAt: NOW, startedAt:null, finishedAt:null,
      trainFrom: wrap.querySelector('#nx-from').value, trainTo: wrap.querySelector('#nx-to').value,
      dataRows: 0, checkpointPath:null, error:null, finalMetrics:null, config: cfg,
      loss: Array.from({ length: 40 }, (_, k) => 0.09 * Math.exp(-k / 11) + 0.015),
    })
    close(); go('#/research/experiments'); render()
  }
}
